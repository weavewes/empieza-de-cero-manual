title: Manual de Operaciones - Empieza de Cero
description: >-
  Manual de operaciones interno de Empieza de Cero, SL.
  Procesos, procedimientos, checklists y políticas del equipo.

remote_theme: just-the-docs/just-the-docs

# Site settings
baseurl: "/empieza-de-cero-manual"
url: "https://weavewes.github.io"

# Just the Docs settings
search_enabled: true
search.previews: 2
search.preview_words_before: 3
search.preview_words_after: 3

# Navigation
color_scheme: nil
aux_links:
  "Empieza de Cero":
    - "https://empiezaddecero.es"

heading_anchors: true

# Footer
footer_content: "© 2026 Empieza de Cero, SL — Mantenido por Weaves"

# Back to top link
back_to_top: true
back_to_top_text: "Volver arriba"

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
