title: Manual de Operaciones - Empieza de Cero
description: >-
  Manual de operaciones interno de Empieza de Cero, SL.
  Procesos, procedimientos, checklists y políticas del equipo.

# Site settings
baseurl: "/empieza-de-cero-manual"
url: "https://weavewes.github.io"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout

# Allow files without frontmatter to be processed
optional_front_matter:
  remove_originals: false

# Default layout for all pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Navigation structure
navigation:
  - title: Inicio
    url: /
    icon: 🏠
  - title: Procesos
    url: /procesos/
    icon: 🔄
    children:
      - title: Registro y Gestión de Conectores
        url: /procesos/registro-gestion-conectores-referidores.html
  - title: Procedimientos
    url: /procedimientos/
    icon: 📋
  - title: Checklists
    url: /checklists/
    icon: ✅
    children:
      - title: Lanzamiento de Campaña
        url: /checklists/ejemplo-lanzamiento-campana.html
  - title: Políticas
    url: /politicas/
    icon: 🛡️
    children:
      - title: Seguridad de Información
        url: /politicas/ejemplo-seguridad-informacion.html
  - title: Anexos
    url: /anexos/
    icon: 📎
    children:
      - title: Plantilla de Propuesta
        url: /anexos/ejemplo-plantilla-propuesta.html

# Footer
footer_content: "© 2026 Empieza de Cero, SL — Mantenido por Weaves"

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
